name: Bug report
description: Report a bug in KingStop
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please check
        the [existing issues](https://github.com/BerlinDeskMudit/kingswork-trading-intelligence/issues?q=is%3Aissue)
        first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact steps, any affected route/endpoint, and sample input.
      placeholder: |
        1. Start backend (uvicorn main:app --port 8000)
        2. Log in ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system is affected?
      options:
        - Backend / API
        - Frontend / UI
        - Signals / Analytics
        - Portfolio / Backtesting / Risk
        - Auth / Security
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Branch, commit hash, or release, if known.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs or attach a screenshot. Never paste secrets.